# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit's reviews of this repository (the tools at the root, the workbench and the Jint testbench in workbench/).
# AGENTS.md (the verified facts about Nucleus Co-op that the code relies on)
# is read automatically as the review guidelines; the skill's docs below add the rules for handler code. The
# Nucleus Co-op source itself is reachable through the DeepWiki MCP server, connected in CodeRabbit's web app.
language: en-GB
tone_instructions: "Plain, short English. Say what breaks and for whom. Facts in AGENTS.md are verified against Nucleus and Jint: don't suggest 'fixing' them. Desktop first; phones must work but aren't tailored: don't suggest phone-only layouts."
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    # Work goes into the next release first (AGENTS.md); main is the release. Review pull requests into either.
    base_branches:
      - claude/next-release

  # Generated or vendored: never edited by hand (AGENTS.md "Generated files"). Review the generator instead.
  path_filters:
    - "!data/nucleus-api.json"
    - "!data/js-builtins.json"
    - "!data/window-messages.json"
    - "!types/nucleus.d.ts"
    - "!plugin/skills/nucleus-handler/scripts/nucleus.js"
    - "!plugin/skills/nucleus-handler/reference/api.md"
    - "!npp-plugin/include/**"
    - "!**/package-lock.json"
    # The workbench's generated, recorded or binary files: review the script that makes them instead.
    - "!workbench/playground/src/usage.json"
    - "!workbench/probes/expected.txt"
    - "!workbench/design/mascots/history/**"
    - "!workbench/design/mascots/archive/**"
    - "!workbench/docs/images/**"
    - "!workbench/docs/videos/**"

  path_instructions:
    - path: "src/core/**"
      instructions: |
        Shared by the VS Code extension, the CLI, the LSP/MCP servers, the skill and the browser workbench.
        - No `vscode` import, and no Node or DOM APIs in sim.ts, pkgcheck.ts or gamefolder.ts (the workbench imports them).
        - A new editor feature goes into features.ts first as plain data, then into every adapter (src/extension.ts, src/lsp.ts; the Notepad++ plugin if it shows something new). Flag one added to a single adapter only.
        - Nucleus runs handlers with Jint 2.11.58 (ES5 plus let/const acting as var). Behaviour claims about Jint or Nucleus must match AGENTS.md or name the probe/source they come from.
    - path: "src/core/{lint,jsrules,ruledocs}.ts"
      instructions: |
        A rule change needs: tests in src/test/lint.test.ts including a no-false-positive case; the rule listed in package.json (contributes.configuration, splitscreenme.lint.rules.properties) and in the README table; a page in ruledocs.ts whose `bad` example triggers it and `good` doesn't. Published, working Hub handlers must produce no errors: ask how it was checked against them.
    - path: "src/core/format.ts"
      instructions: "Format must never move a line break (Nucleus executes a handler line by line) and must re-tokenize and compare with the original, refusing on any difference. Flag anything that weakens that guarantee."
    - path: "src/{sandbox,sandbox-vm,simworker,sim-sandbox-entry,sim-worker-entry,debugrun}.ts"
      instructions: "Handler code is untrusted: it may only run inside the vm sandbox (simulateIsolated/traceIsolated or the sim worker), never through simulate() from Node code. Check time and memory limits stay in place; src/test/sim.test.ts tries the known escapes."
    - path: "src/{hubcache.ts,core/hub.ts}"
      instructions: "Every Hub read goes through hubcache.ts with hubClientHeaders(tool, feature): no direct Hub API calls, nothing personal in requests, packages once per version, capped retries. The Hub is run by volunteers; keep its load low."
    - path: "src/{mcp,lsp,dap,cli}.ts"
      instructions: "Thin adapters over src/core. Logic that other tools also need belongs in src/core. CLI commands and MCP tools that change the user's files or Nucleus folder must say so in their description."
    - path: "src/core/{templates,snippets,airules}.ts"
      instructions: "Handler code generated here must be ES5 and lint-clean, and name only real API members (tests check this; flag new code that isn't covered)."
    - path: "plugin/skills/**/*.md"
      instructions: "Handler examples must be ES5 and lint-clean and name only real Game.*/Context.* members (a test resolves them). Keep instructions that agents follow precise and short."
    - path: "data/claude-{docs,param-docs}.json"
      instructions: "AI-written docs: every entry needs `doc` and `basis` (the Nucleus/Proto Input files and functions it rests on) and states only what that source shows. `checkedBy`/`checkedOn` only for a real person's check."
    - path: "npp-plugin/**"
      instructions: "A thin client of `ncdev lsp` (C++17, MinGW). Logic belongs in src/core/features.ts or src/lsp.ts, not here."
    - path: "package.json"
      instructions: |
        Command and setting ids are links people bind keys to: never rename one without a deprecated alias pointing at the new id (AGENTS.md: links live for ever).
        Anything contributed for `javascript` (snippets, breakpoints, semantic scopes, debugger, keybindings) must also be contributed for `nucleus-handler` (src/handlermode.ts); flag one added for JavaScript only.
    - path: "src/{extension,handlermode}.ts"
      instructions: "Handlers open in the `nucleus-handler` language (handlermode.ts), so every provider is registered for both `nucleus-handler` and `javascript`. Flag a provider or selector added for one of them only."
    - path: "docs/images/gallery/**"
      instructions: "One set per view, `<tool>-<view>-{light,dark}.webp`, shared by the README and the workbench start page (whose build stops if one is missing). Flag a view added in one theme only, a renamed or removed file the start page lists, or a separate copy of an existing view."
    - path: "CHANGELOG.md"
      instructions: "User-visible changes go under the unreleased section in an emoji group (✨ New, 🛠️ Improved, 🐛 Fixed, ⚡ Faster, ⚠️ Changed, 🙏 Thanks), starting with a short bold summary, then one or two plain sentences."
    - path: "src/test/**"
      instructions: "Tests run with node:test against the built dist-test files. Prefer real handler code over mocks; vscode-mock.ts stands in for the vscode module."
    - path: "workbench/playground/src/**"
      instructions: |
        The workbench and Learn. Check against AGENTS.md "Who it's for" and "The workbench":
        - Help on request, not on screen: anything new that shows for someone who didn't ask must sit behind a hover, tap, key or setting.
        - Everything reachable from the keyboard and the command palette; WCAG 2.1 AA (contrast in light and dark, labels, focus).
        - Every code block syntax highlighted through codehl.ts (hlHtml / hlCode / modeFor).
        - New parts get an initX(deps) with what they need passed in, not top-level code that depends on declaration order.
        - New workbench features need a tip in tips.ts and a line in workbench/CHANGELOG.md.
    - path: "workbench/playground/src/links.ts"
      instructions: "Links live for ever: a changed `#…` link must stay reachable through MOVED_LINKS (workbench/tools/links.test.mjs checks every one). Never remove an entry."
    - path: "workbench/playground/src/{themes.json,themekit.ts,customtheme.ts}"
      instructions: "Looks are data. parseTheme accepts known tokens only and never `url()`. Check new colours for contrast in light and dark."
    - path: "workbench/playground/*.mjs"
      instructions: "The site's build and pages (start, tools, Learn, docs, checks). Published URLs and anchors must keep working (old anchors as `anchor-alias` spans, MOVED anchors); every page keeps the shared header, kbd keys, copy buttons and highlighting from the site-wide pass in build.mjs."
    - path: "workbench/playground/{test-guide.md,test-guide-page.mjs}"
      instructions: "Release test guide, only while a test round runs: built only with --test-build and never on the live site; test-guide.md is deleted at the release. Don't review its prose."
    - path: "workbench/tools/hub-*.mjs"
      instructions: "Keep the Hub's load low: only new versions, one request at a time, packages once per version, capped retries. The Hub is run by volunteers."
    - path: ".github/workflows/**"
      instructions: "Secrets (DISCORD_WEBHOOKS, tokens) never reach logs or forks' pull requests. Deploys only when the built output changed. A failed announcement never fails a release."
    - path: "workbench/{src,probes}/**"
      instructions: "The Jint 2.11.58 testbench: probes record how the real engine behaves, and the workbench's Try it is checked against them (workbench/playground/sim-parity.mjs). A changed expectation needs the probe that shows it."
    - path: "workbench/CHANGELOG.md"
      instructions: "User-visible changes go under the unreleased section in an emoji group (✨ New, 🛠️ Improved, 🐛 Fixed, ⚡ Faster, ⚠️ Changed, 🙏 Thanks), starting with a short bold summary, then one or two plain sentences."

knowledge_base:
  # MCP servers (DeepWiki, connected in CodeRabbit's web app): 'auto' would turn them off for public repositories.
  mcp:
    usage: enabled
  code_guidelines:
    enabled: true
    filePatterns:
      - "plugin/skills/nucleus-handler/SKILL.md"
      - "plugin/skills/nucleus-handler/reference/workflow.md"
      - "plugin/skills/nucleus-handler/reference/troubleshooting.md"
      - "PORTING.md"
      - "CONTRIBUTING.md"
      - "workbench/playground/src/editor-icons/README.md"

chat:
  auto_reply: true
