name: Tester feedback
description: Something wrong, confusing or missing in a check, Try it, the VS Code extension, the Notepad++ plugin, ncdev, another editor, the browser workbench, Learn or the site (home, tools, docs and check pages).
labels: [feedback]
body:
  - type: markdown
    attributes:
      value: |
        A wrong warning? [This check is wrong](https://github.com/Snailedlt/nucleus-devtools/issues/new?template=check-wrong.yml) asks the right questions. A game that doesn't work with one **Hub handler**? That's for its author: ask on its Hub page, the [Discord](https://discord.gg/XxGMkqCf4r) or [r/nucleuscoop](https://www.reddit.com/r/nucleuscoop/).
  - type: dropdown
    id: area
    attributes:
      label: Where
      options:
        - Checks (a wrong or missing warning)
        - Try it or the debugger (what it says Nucleus does is wrong)
        - Suggestions, hovers or docs
        - VS Code extension
        - Notepad++ plugin
        - ncdev (command line)
        - Another editor (through ncdev lsp)
        - AI agent kit (Claude Code plugin, MCP)
        - Workbench (browser)
        - Learn
        - Docs and check pages
        - Home and tools pages
        - Something else
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a wrong warning, say what Nucleus actually does when you run the handler, if you know. For Try it, what really happened in Nucleus Co-op. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: The error
      description: Filled in when you report an error from the workbench's "Something went wrong" note. Leave it empty otherwise.
      render: text
  - type: textarea
    id: simulated
    attributes:
      label: What Try it showed
      description: Filled in when you open this from Try it ("Nucleus did something different"). Leave it empty otherwise.
      render: text
  - type: textarea
    id: handler
    attributes:
      label: Handler
      description: A Hub link, a workbench share link, or the smallest piece of handler code that shows it.
      render: js
  - type: input
    id: version
    attributes:
      label: Version
      description: The .vsix you installed (e.g. v0.6.0), or `ncdev --version`. Filled in from the workbench; otherwise the date you saw it there.
  - type: textarea
    id: context
    attributes:
      label: Details from the tool
      description: Filled in for you when you open this form from the workbench, VS Code, Notepad++ or ncdev (versions, settings, which handler; your code only if you chose to include it). Please leave it as it is. A bot keeps a copy as the first comment.
      render: text
