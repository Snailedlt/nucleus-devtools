name: Test build
run-name: Test build of ${{ inputs.branch || 'claude/next-release' }}
# The tools as they'll be released, before they are: builds the real .vsix, ncdev.exe (with the Notepad++ plugin
# inside) and the plugin's zip from a branch of this repository, the way the Release workflow does, and publishes
# them as the pre-release `test-build` (replaced each run). A local site built with
#   node build.mjs --preview --test-build   (in workbench/playground)
# links its downloads to it, so testers get the tools from the tools page like real users, just the newer version.
# The tools' update checks never pick it up although it's in the same repository: ncdev update and the Notepad++
# plugin take only a release with SHA256SUMS.txt (this one has none), and the start and tools pages only v… tags.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build (empty: the branch being tested for the next release)'
        required: false
        default: ''
      commit:
        description: 'Exact commit to build (full or short SHA; empty: the branch''s newest). Must be on the branch.'
        required: false
        default: ''
  push:
    branches: [preview-ux]
    paths: ['.github/workflows/test-build.yml']
  # Hourly: the next release's tools stay current (the `claude/next-release` preview's tools page links them). Skipped
  # when the published test build already is the branch's newest commit.
  schedule:
    - cron: '23 * * * *'

# Nothing by default; each job asks for what it needs.
permissions: {}

# The repository the test build comes from: this one (the tools and the workbench live together).
env:
  EXT_REPO: ${{ github.repository }}

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  # On the hourly schedule: only when the extension branch has a commit the test build doesn't have yet.
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      stale: ${{ steps.c.outputs.stale }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ inputs.branch || 'claude/next-release' }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # A failed lookup (network, GitHub) fails the run; only a lookup that finds no branch skips it.
          refs=$(git ls-remote "https://github.com/$EXT_REPO" "refs/heads/$BRANCH") || { echo "::error::Couldn't look up $BRANCH."; exit 1; }
          head=$(printf '%s\n' "$refs" | cut -f1)
          [ -n "$head" ] || { echo "No branch $BRANCH: nothing to build."; echo "stale=false" >> "$GITHUB_OUTPUT"; exit 0; }
          if gh release view test-build --json body -q .body 2>/dev/null | grep -q "$head"; then echo "The test build is $head already."; echo "stale=false" >> "$GITHUB_OUTPUT"; else echo "stale=true" >> "$GITHUB_OUTPUT"; fi

  # Runs the extension branch's own npm scripts, so it gets no token that can write: read-only, and it hands the
  # built files to the publish job as an artifact. (Its scripts could change PATH or the environment of later steps
  # in this job, which is why publishing happens in a separate job.)
  build:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      BRANCH: ${{ inputs.branch || 'claude/next-release' }}
      COMMIT: ${{ inputs.commit }}
    outputs:
      ver: ${{ steps.vsix.outputs.ver }}
      sha: ${{ steps.src.outputs.sha }}
      author: ${{ steps.src.outputs.author }}
      date: ${{ steps.src.outputs.date }}
    steps:
      # The exact commit is fixed here, before any of the extension's code runs, and named in the release notes.
      - name: The extension, at the chosen commit (or the branch's newest)
        id: src
        run: |
          [[ -z "$COMMIT" || "$COMMIT" =~ ^[0-9a-f]{7,40}$ ]] || { echo "::error::commit must be a SHA (7-40 hex characters)"; exit 1; }
          git clone --quiet --filter=blob:none --no-checkout --branch "$BRANCH" "https://github.com/$EXT_REPO" ext
          cd ext
          FULL=$(git rev-parse --verify --quiet "${COMMIT:-HEAD}^{commit}") || { echo "::error::Commit $COMMIT not found in $EXT_REPO"; exit 1; }
          git merge-base --is-ancestor "$FULL" HEAD || { echo "::error::Commit $FULL is not on $BRANCH"; exit 1; }
          git checkout --quiet --detach "$FULL"
          {
            echo "sha=$FULL"
            echo "author=$(git log -1 --format='%an' "$FULL" | tr -cd '[:alnum:] ._-' | cut -c1-60)"
            echo "date=$(git log -1 --format='%cI' "$FULL")"
          } >> "$GITHUB_OUTPUT"
          echo "Building $EXT_REPO@$FULL ($BRANCH)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test it
        working-directory: ext
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: The .vsix
        id: vsix
        working-directory: ext
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p ../out
          npx vsce package --no-dependencies -o "../out/splitscreenme-vscode-v$VER-test.vsix"
      - name: ncdev.exe (with the Notepad++ plugin) and the plugin's zip, tested like a release
        working-directory: ext
        run: |
          npm run build
          sh scripts/build-native.sh win-x64,linux-x64
          node scripts/smoke-standalone.mjs dist-sea/ncdev-linux-x64
          cp dist-sea/ncdev.exe ../out/ncdev.exe
          cp dist-sea/ncdev-linux-x64 ../out/ncdev-linux-x64
          (cd dist-sea && zip -q -X ../../out/NcDev.zip NcDev.dll)
      - uses: actions/upload-artifact@v4
        with:
          name: test-build
          path: out/
          if-no-files-found: error
          retention-days: 3

  # The only job with a token that can write. It runs nothing from the extension: it checks the version and commit
  # it was handed, then publishes the three files as the `test-build` pre-release (replacing the last one).
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ inputs.branch || 'claude/next-release' }}
      VER: ${{ needs.build.outputs.ver }}
      SHA: ${{ needs.build.outputs.sha }}
      AUTHOR: ${{ needs.build.outputs.author }}
      DATE: ${{ needs.build.outputs.date }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: test-build
          path: out
      - name: Check what the build handed over
        run: |
          [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected version: $VER"; exit 1; }
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Unexpected commit: $SHA"; exit 1; }
          [[ "$AUTHOR" =~ ^[A-Za-z0-9\ ._-]{0,60}$ ]] || { echo "::error::Unexpected author: $AUTHOR"; exit 1; }
          [[ "$DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}([+-][0-9:]{5}|Z)$ ]] || { echo "::error::Unexpected date: $DATE"; exit 1; }
          [[ "$EXT_REPO" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::Unexpected repository: $EXT_REPO"; exit 1; }
          [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || { echo "::error::Unexpected branch name: $BRANCH"; exit 1; }
          ls out
          [ "$(ls out | LC_ALL=C sort | tr '\n' ' ')" = "NcDev.zip ncdev-linux-x64 ncdev.exe splitscreenme-vscode-v$VER-test.vsix " ] || { echo "::error::Unexpected files"; exit 1; }
      - name: Publish the test-build pre-release (replacing the last one)
        run: |
          gh release delete test-build --yes --cleanup-tag 2>/dev/null || true
          cat > notes.md <<EOF
          **For testing only: not released.** $EXT_REPO \`$BRANCH\` at [\`${SHA:0:7}\`](https://github.com/$EXT_REPO/commit/$SHA) (version $VER), built like a release.

          Built from commit \`$SHA\` by $AUTHOR, committed $DATE.

          Get it the way users will: from the tools page of the next release's site, https://nucleus-workbench-next.vercel.app/tools/ (or build the site with \`node build.mjs --preview --test-build\` in \`workbench/playground\` and serve \`dist/pages\`).
          EOF
          gh release create test-build "out/splitscreenme-vscode-v$VER-test.vsix" out/ncdev.exe out/ncdev-linux-x64 out/NcDev.zip --prerelease --target "$GITHUB_SHA" --title "Test build: v$VER (${SHA:0:7})" --notes-file notes.md
      - name: Summary
        run: |
          {
            echo "## Test build: v$VER ($EXT_REPO $BRANCH @ $SHA, by $AUTHOR, $DATE)"
            echo
            echo "https://github.com/$GH_REPO/releases/tag/test-build"
            echo
            echo "Local site with these downloads: \`node build.mjs --preview --test-build\` in workbench/playground/, then serve dist/pages."
          } >> "$GITHUB_STEP_SUMMARY"
