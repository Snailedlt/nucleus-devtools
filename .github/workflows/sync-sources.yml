name: Sync with Nucleus and the docs
# Once a day, a tiny check (git ls-remote, a few hundred bytes) whether Nucleus Co-op's source or the
# splitscreen.me docs moved past the commits data/nucleus-api.json was generated from. Only then: clone
# both, regenerate the API model, docs and skill files, test, and open (or update) a pull request with
# the diff, so new or changed options show up for review instead of silently. The same pull request carries
# the docs' vote counts (data/doc-votes.json, which make "Verified by people" labels) and the Hub handlers' usage
# (data/hub-examples.json: the docs' Hub examples and counts) with each handler's game engine (data/hub-engines.json,
# from the cached Wikidata answers in data/wikidata-engines.json: no Wikidata query here), all from the testbench's
# data branch.
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
on:
  schedule:
    - cron: '3 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-sources
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Did Nucleus or the docs move?
        id: check
        run: |
          have_n=$(node -p "require('./data/nucleus-api.json').source.nucleus")
          have_w=$(node -p "require('./data/nucleus-api.json').source.www")
          n=$(git ls-remote https://github.com/SplitScreen-Me/splitscreenme-nucleus refs/heads/master | cut -f1)
          w=$(git ls-remote https://github.com/SplitScreen-Me/splitscreenme-www HEAD | cut -f1)
          echo "nucleus $have_n -> $n, docs $have_w -> $w"
          # The model stores short ids (7 or more characters): compare by prefix.
          case "$n" in "$have_n"*) same_n=1 ;; *) same_n=0 ;; esac
          case "$w" in "$have_w"*) same_w=1 ;; *) same_w=0 ;; esac
          if [ $same_n = 1 ] && [ $same_w = 1 ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          n=$(echo "$n" | cut -c1-7); w=$(echo "$w" | cut -c1-7)
          echo "nucleus=$n" >> "$GITHUB_OUTPUT"; echo "www=$w" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The docs' votes and the Hub handlers' usage (the testbench's data branch)
        id: data
        run: |
          node scripts/doc-votes.mjs || echo "::warning::No votes report: data/doc-votes.json stays."
          if git clone -q --depth 1 --branch data --filter=blob:none https://github.com/Snailedlt/nucleuscoop-handler-testbench.git ../hubdata; then
            npm ci --ignore-scripts --no-audit --no-fund >/dev/null
            # The two Hub snapshots go together: if either fails, both stay as they were.
            if node scripts/hub-engines.mjs --hub ../hubdata && node scripts/hub-examples.mjs --hub ../hubdata; then echo "hubok=true" >> "$GITHUB_OUTPUT"; else
              echo "::warning::hub-engines or hub-examples failed: data/hub-engines.json and data/hub-examples.json stay."
              git checkout -- data/hub-examples.json data/hub-engines.json
            fi
          fi
          # Only the date moved in the Hub snapshots (their data, without takenAt, is the same): nothing to review.
          same() { node -e 'const fs=require("fs"),cp=require("child_process");const f=process.argv[1];const strip=(t)=>{const j=JSON.parse(t);delete j.takenAt;return JSON.stringify(j)};let old="";try{old=cp.execSync("git show HEAD:"+f,{encoding:"utf8",maxBuffer:1e9})}catch{process.exit(1)}process.exit(strip(old)===strip(fs.readFileSync(f,"utf8"))?0:1)' "$1"; }
          hub=false; votes=false
          if ! same data/hub-examples.json || ! same data/hub-engines.json; then hub=true; else git checkout -- data/hub-examples.json data/hub-engines.json; fi
          git diff --quiet -- data/doc-votes.json || votes=true
          echo "hub=$hub" >> "$GITHUB_OUTPUT"; echo "votes=$votes" >> "$GITHUB_OUTPUT"
          if [ $hub = true ] || [ $votes = true ]; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
      - if: steps.check.outputs.changed == 'true' || steps.data.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Regenerate
        if: steps.check.outputs.changed == 'true' || steps.data.outputs.changed == 'true'
        run: |
          git clone --quiet --depth 1 --filter=blob:none https://github.com/SplitScreen-Me/splitscreenme-nucleus ../splitscreenme-nucleus
          git clone --quiet --depth 1 --filter=blob:none https://github.com/SplitScreen-Me/splitscreenme-www ../splitscreenme-www
          git clone --quiet --depth 1 --filter=blob:none https://github.com/SplitScreen-Me/splitscreenme-protoInput ../splitscreenme-protoInput
          npm ci
          npm run generate
          # Hub usage counted against the model this PR publishes (new members included, also when upstream moved after
          # the check above), then the docs again: whenever both snapshots were made above. A failed count stops the
          # step (set -e) before the build and tests.
          if [ "${{ steps.data.outputs.hubok }}" = true ]; then
            node scripts/hub-examples.mjs --hub ../hubdata
            # Each snapshot on its own: one whose data didn't change (only takenAt moved) stays as committed.
            for f in data/hub-examples.json data/hub-engines.json; do
              if node -e 'const fs=require("fs"),cp=require("child_process");const f=process.argv[1];const strip=(t)=>{const j=JSON.parse(t);delete j.takenAt;return JSON.stringify(j)};let old="";try{old=cp.execSync("git show HEAD:"+f,{encoding:"utf8",maxBuffer:1e9})}catch{process.exit(1)}process.exit(strip(old)===strip(fs.readFileSync(f,"utf8"))?0:1)' "$f"; then git checkout -- "$f"; fi
            done
            npm run generate
          fi
          npm run build
          npm test
          # The AI docs' source links (permalinks at the clones' commits) work.
          GITHUB_TOKEN=${{ github.token }} npm run check-links
      - name: Open or update the pull request
        if: steps.check.outputs.changed == 'true' || steps.data.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the recorded commit ids changed (the model's `source`, `sourceCommits` and the commits in its source
          # permalinks, the .d.ts header): nothing to review.
          same_model() { node -e 'const cp=require("child_process"),fs=require("fs");const strip=(t)=>{const j=JSON.parse(t);delete j.source;delete j.sourceCommits;return JSON.stringify(j).replace(/(\/(?:blob|tree)\/)[0-9a-f]{40}/g,"$1")};process.exit(strip(cp.execSync("git show HEAD:data/nucleus-api.json",{encoding:"utf8",maxBuffer:1e9}))===strip(fs.readFileSync("data/nucleus-api.json","utf8"))?0:1)'; }
          if git diff --quiet -- . ':(exclude)data/nucleus-api.json' ':(exclude)types/nucleus.d.ts' && [ "$(git diff --numstat -- types/nucleus.d.ts | awk '{s+=$1} END {print s+0}')" -le 2 ] && same_model; then echo "Upstream moved, but no option or doc changed."; exit 0; fi
          # The Hub note from the final snapshots (after the recount), not the first pass's flag.
          hubdiff=false; git diff --quiet -- data/hub-examples.json data/hub-engines.json || hubdiff=true
          branch=sync/upstream
          git switch -C "$branch"
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -qam "API model from Nucleus ${{ steps.check.outputs.nucleus }} and docs ${{ steps.check.outputs.www }}, with the docs' votes and Hub usage"
          git push -qf origin "$branch"
          what=""
          [ "${{ steps.check.outputs.changed }}" = true ] && what="Nucleus Co-op's source or the splitscreen.me docs changed: review the diff of \`data/nucleus-api.json\` for new, removed or renamed options. "
          [ "$hubdiff" = true ] && what="$what The Hub handlers' usage changed (\`data/hub-examples.json\`, \`data/hub-engines.json\`): examples and counts in the docs. "
          [ "${{ steps.data.outputs.votes }}" = true ] && what="$what The docs' votes changed (\`data/doc-votes.json\`). "
          body="The generated API model, type definitions and skill reference were regenerated (tests pass). $what

          If users will notice the change, add a line to \`CHANGELOG.md\` under Unreleased before merging."
          gh pr view "$branch" >/dev/null 2>&1 && gh pr edit "$branch" --body "$body" || gh pr create --head "$branch" --base main --title "Sync the API model with Nucleus and the docs" --body "$body"
