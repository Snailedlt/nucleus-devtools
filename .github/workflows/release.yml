name: Release
run-name: Release ${{ inputs.version || github.ref_name || 'package.json version' }}
# Builds the .vsix, nucleus.js, ncdev.exe (the standalone tool with the Notepad++ plugin inside, #18/#19) and
# the offline workbench, and publishes them as a GitHub release with
# that version's CHANGELOG.md section as the notes. Run it by hand (leave the version empty for
# package.json's version), or push a tag like v0.6.0. The run's summary has the links and the Discord post.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag. Leave empty for package.json''s version (e.g. v0.6.0).'
        required: false
        default: ''

permissions:
  contents: write
  issues: write # "This is in vX.Y.Z" on the issues the release fixes

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The history without file contents: npm test checks that the AI docs' links to this repository's own
          # files are at each file's last change (src/test/docs.test.ts).
          fetch-depth: 0
          filter: blob:none
      - name: Only from main (or a pushed tag)
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the Release workflow from main (this run is on ${{ github.ref_name }}): merge the release pull request first."
          exit 1
      - name: Which version? (checked before anything is built)
        id: version
        run: node scripts/release-version.mjs "${{ inputs.version }}"
        env: # a pushed tag already exists: then only check it matches package.json and has notes
          PUSHED_TAG: ${{ github.event_name == 'push' && github.ref_name || '' }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Release notes (from CHANGELOG.md)
        run: node scripts/release-notes.mjs --tag "${{ steps.version.outputs.tag }}" > release-notes.md
      - run: npm run typecheck
      - run: npm test
      - name: The skill's generated files are committed (the release commit includes the rebuilt scripts/nucleus.js)
        run: git diff --exit-code -- plugin/
      - name: Build the offline workbench (workbench.html)
        run: |
          cd workbench/playground && npm ci && node build.mjs --refresh-hub
          cp dist/workbench-standalone.html "$GITHUB_WORKSPACE/workbench.html"
      - name: Package
        run: npx vsce package --no-dependencies -o "splitscreenme-vscode-${{ steps.version.outputs.tag }}.vsix"
      - name: Build ncdev.exe (standalone, with the Notepad++ plugin) and ncdev-linux-x64, and test the Linux one
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          npm run build
          sh scripts/build-native.sh win-x64,linux-x64
          node scripts/smoke-standalone.mjs dist-sea/ncdev-linux-x64
          grep -E ' (ncdev\.exe|ncdev-linux-x64)$' dist-sea/SHA256SUMS.txt > SHA256SUMS.txt
          cp dist-sea/ncdev.exe ncdev.exe
          cp dist-sea/ncdev-linux-x64 ncdev-linux-x64
          sh scripts/npp-zips.sh
          # The Plugins Admin entries (nppPluginList); stops the release if a DLL's version or a zip is wrong.
          node scripts/npp-plugin-list.mjs --tag "$TAG" > npp-plugin-list.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          pre=""; case "$TAG" in *-*) pre="--prerelease";; esac
          # 0.x is the public beta: the title says so (the tag stays plain, so links and update checks don't change).
          title="$TAG"; case "$TAG" in v0.*) title="$TAG (beta)";; esac
          cp dist/cli.js nucleus.js
          gh release create "$TAG" "splitscreenme-vscode-$TAG.vsix" ncdev.exe ncdev-linux-x64 SHA256SUMS.txt NcDev.zip NcDev-x86.zip nucleus.js workbench.html --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md $pre
      - name: Announce on Discord (when DISCORD_WEBHOOKS is set)
        env:
          TAG: ${{ steps.version.outputs.tag }}
          DISCORD_WEBHOOKS: ${{ secrets.DISCORD_WEBHOOKS }}
        run: |
          node scripts/release-notes.mjs --tag "$TAG" --discord --json > discord.json
          node scripts/announce.mjs discord.json
      - name: Tell the issues it fixes (never fails the release)
        id: fixed
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            // scripts/issue-bots.mjs (tested by src/test/bots.test.ts): "Fixes #N" in the commits since the last release,
            // and the issues the CHANGELOG section names under Fixed or as (#N). This repository only, once per issue.
            const fs = require('fs');
            const bots = await import(`${process.env.GITHUB_WORKSPACE}/scripts/issue-bots.mjs`);
            const tag = process.env.TAG;
            const url = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/tag/${tag}`;
            const commits = await bots.commitsSincePrevious({ github, context, tag, prefix: 'v', core });
            const done = await bots.runFixedComments({ github, context, tag, url, notes: fs.readFileSync('release-notes.md', 'utf8'), commits, core });
            core.setOutput('issues', done.map((n) => `#${n}`).join(', '));
      - name: Summary (links and the Discord post)
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          repo="https://github.com/${{ github.repository }}"
          {
            echo "## ✅ $TAG is out"
            echo
            echo "**Release:** $repo/releases/tag/$TAG · **Download:** [splitscreenme-vscode-$TAG.vsix]($repo/releases/download/$TAG/splitscreenme-vscode-$TAG.vsix)"
            echo
            echo "### 💬 Post this in the Discord thread"
            echo
            echo '```text'
            node scripts/release-notes.mjs --tag "$TAG" --discord
            echo '```'
            echo
            if [ -n "${{ secrets.DISCORD_WEBHOOKS != '' && 'yes' || '' }}" ]; then echo "Posted to Discord automatically (DISCORD_WEBHOOKS)."; else echo "To post it automatically next time, add a DISCORD_WEBHOOKS secret (one Discord webhook URL per line)."; fi
            echo
            if [ -n "${{ steps.fixed.outputs.issues }}" ]; then echo "Told the issues it fixes: ${{ steps.fixed.outputs.issues }}"; echo; fi
            echo "The intro page's download link and the extension's update note pick up the new version by themselves; ncdev update and the Notepad++ plugin see the new ncdev.exe."
            echo
            echo "<details><summary>Notepad++ Plugins Admin entries (for a pull request to notepad-plus-plus/nppPluginList; not listed automatically)</summary>"
            echo
            echo '```json'
            cat npp-plugin-list.txt
            echo '```'
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: What went wrong
        if: failure()
        run: |
          {
            echo "## ❌ Not released"
            echo
            echo "Nothing was published. Open the step marked ❌ above for the reason; a version or release-notes problem is explained at the top of the run."
          } >> "$GITHUB_STEP_SUMMARY"
