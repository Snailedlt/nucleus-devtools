# One-off, after the workbench moved here: copies the old workbench repo's `data` (Hub index, votes, usage counts)
# and `assets` (mascot packs) branches into this repository. Run it once after merging, before the Hub sync's first
# run here (04:17 UTC). It never overwrites: a branch that already exists here is left as it is. Delete this file
# once both branches are here.
name: Import the workbench's data branches
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Copy data and assets from Snailedlt/nucleuscoop-handler-testbench
        run: |
          set -e
          for b in data assets; do
            if git ls-remote --exit-code --heads origin "$b" >/dev/null; then
              echo "::notice::$b already exists here: left as it is."
              continue
            fi
            git fetch --no-tags https://github.com/Snailedlt/nucleuscoop-handler-testbench "refs/heads/$b:refs/heads/import-$b"
            git push origin "refs/heads/import-$b:refs/heads/$b"
            echo "Copied $b ($(git rev-parse --short "import-$b"))." | tee -a "$GITHUB_STEP_SUMMARY"
          done
