name: Workbench preview (Vercel)
# Builds of the workbench to try before they're released, on Vercel (the nucleus-workbench-preview project,
# created on the first deploy):
# - every pull request: its own preview, linked in one comment on the pull request (updated on every push), built
#   with splitscreenme-vscode's branch of the same name when there is one (else its main);
# - the next release: https://nucleus-workbench-next.vercel.app, this repo's and splitscreenme-vscode's
#   claude/next-release, with the tools page linking the `test-build` pre-release (test-build.yml) instead of the
#   last release. Updated on every push to claude/next-release here and after every new test build.
# Built with --preview (no search indexing, What's new shows Unreleased) and without FEEDBACK_GOATCOUNTER, so votes
# and counts never mix with the live site's. Previews sit behind Vercel's login unless Deployment Protection is off.
# One-time setup: a VERCEL_TOKEN repository secret (vercel.com/account/tokens, scoped to "snailedlt's projects").
# Without it, or for pull requests from forks (no secrets), the workflow builds and says why it didn't deploy.
on:
  pull_request:
  push:
    branches: [claude/next-release]
  workflow_run:
    workflows: [Test build]
    types: [completed]
  workflow_dispatch:
    inputs:
      core:
        description: splitscreenme-vscode branch to build with (empty = the same name as this branch, else main)
        required: false

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_SCOPE: snailedlts-projects
  VERCEL_PROJECT: nucleus-workbench-preview
  NEXT_BRANCH: claude/next-release
  NEXT_URL: nucleus-workbench-next.vercel.app

jobs:
  preview:
    # After a test build: only when it published one (a skipped hourly run publishes nothing).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    # On the job, so a skipped run (a failed test build) never cancels a preview; a manual run for another branch
    # has its own group, apart from the next release's.
    concurrency:
      group: preview-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.ref_name != 'claude/next-release' && format('branch-{0}', github.ref_name)) || 'next' }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Pull request or the next release
        id: mode
        # Branch names through the environment, never written into the script.
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            echo "next=false" >> "$GITHUB_OUTPUT"; echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT" = workflow_dispatch ] && [ "$REF_NAME" != "$NEXT_BRANCH" ]; then
            echo "next=false" >> "$GITHUB_OUTPUT"; echo "ref=$REF_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "next=true" >> "$GITHUB_OUTPUT"; echo "ref=$NEXT_BRANCH" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        with:
          # The next release always builds this repo's claude/next-release (a test build runs this file from main).
          ref: ${{ steps.mode.outputs.next == 'true' && env.NEXT_BRANCH || '' }}
      - name: Which splitscreenme-vscode branch
        id: core
        env:
          WANT: ${{ inputs.core }}
          BRANCH: ${{ steps.mode.outputs.ref }}
        run: |
          want="$WANT"
          if [ -z "$want" ]; then
            # The exact branch: ls-remote also matches refs that only end in refs/heads/<name>, so compare the ref
            # field. main when there is none; a failed lookup fails the run.
            refs=$(git ls-remote --heads https://github.com/Snailedlt/splitscreenme-vscode.git) || { echo "::error::Couldn't look up $BRANCH."; exit 1; }
            if printf '%s\n' "$refs" | awk -v r="refs/heads/$BRANCH" '$2 == r { f = 1 } END { exit !f }'; then want="$BRANCH"; else want=main; fi
          fi
          echo "Building with splitscreenme-vscode@$want"
          echo "ref=$want" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Snailedlt/splitscreenme-vscode
          ref: ${{ steps.core.outputs.ref }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: core
      - run: npm ci
        working-directory: playground
      - name: Every Hub handler, from our own copy (the data branch)
        run: git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}.git" playground/.hubdata
      - name: Build
        # The next release's tools page links the test build; a pull request's links the last release.
        run: node build.mjs --core ../core --hub-data .hubdata --preview ${{ steps.mode.outputs.next == 'true' && '--test-build' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: playground
      - name: Deploy to Vercel (a preview, never production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          NEXT: ${{ steps.mode.outputs.next }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::No VERCEL_TOKEN secret (or a pull request from a fork): built, not deployed."
            exit 0
          fi
          cd playground/dist/pages
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          # One archive instead of ~1,150 files: the free plan allows 5,000 uploaded files a day.
          url=$(npx --yes vercel@latest deploy --yes --archive=tgz --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          if [ "$NEXT" = true ]; then
            npx --yes vercel@latest alias set "$url" "$NEXT_URL" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN"
            url="https://$NEXT_URL"
          fi
          echo "Preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Link on the pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CORE: ${{ steps.core.outputs.ref }}
        with:
          script: |
            const marker = '<!-- workbench-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Try this pull request:** ${process.env.URL}`,
              '',
              `The workbench as built from ${sha}, with splitscreenme-vscode@${process.env.CORE}. Updated on every push. The next release as a whole: https://${process.env.NEXT_URL}`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.user?.login === 'github-actions[bot]' && c.body?.includes(marker)); // ours, not a quote of it
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
