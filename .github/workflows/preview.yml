name: Workbench preview (Vercel)
# A preview of the workbench for every pull request, so it can be tried before it's merged: built like the
# GitHub Pages site (pages.yml), with splitscreenme-vscode's branch of the same name when there is one (else its
# main), and deployed to Vercel as a preview of the nucleus-workbench-preview project (created on the first
# deploy). The pull request gets one comment with the link, updated on every push.
# Previews sit behind Vercel's login unless the project's Deployment Protection is turned off.
# One-time setup: a VERCEL_TOKEN repository secret (vercel.com/account/tokens, scoped to "snailedlt's projects").
# Without it, or for pull requests from forks (no secrets), the workflow builds and says why it didn't deploy.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      core:
        description: splitscreenme-vscode branch to build with (empty = the same name as this branch, else main)
        required: false

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VERCEL_SCOPE: snailedlts-projects
  VERCEL_PROJECT: nucleus-workbench-preview

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Which splitscreenme-vscode branch
        id: core
        run: |
          want="${{ inputs.core }}"
          branch="${{ github.head_ref || github.ref_name }}"
          if [ -z "$want" ]; then
            if git ls-remote --exit-code --heads https://github.com/Snailedlt/splitscreenme-vscode.git "$branch" >/dev/null; then want="$branch"; else want=main; fi
          fi
          echo "Building with splitscreenme-vscode@$want"
          echo "ref=$want" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: Snailedlt/splitscreenme-vscode
          ref: ${{ steps.core.outputs.ref }}
          path: core
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: core
      - run: npm ci
        working-directory: playground
      - name: Every Hub handler, from our own copy (the data branch)
        run: git clone -q --depth 1 --branch data "https://github.com/${{ github.repository }}.git" playground/.hubdata
      - name: Build
        # No FEEDBACK_GOATCOUNTER: votes and counts from previews would mix with the live site's.
        run: node build.mjs --core ../core --hub-data .hubdata
        env:
          GITHUB_TOKEN: ${{ github.token }}
        working-directory: playground
      - name: Deploy to Vercel (a preview, never production)
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::No VERCEL_TOKEN secret (or a pull request from a fork): built, not deployed."
            exit 0
          fi
          cd playground/dist/pages
          npx --yes vercel@latest link --yes --project "$VERCEL_PROJECT" --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN" >/dev/null
          url=$(npx --yes vercel@latest deploy --yes --scope "$VERCEL_SCOPE" --token "$VERCEL_TOKEN")
          echo "Preview: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Preview: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: Link on the pull request
        if: github.event_name == 'pull_request' && steps.deploy.outputs.url != ''
        uses: actions/github-script@v7
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CORE: ${{ steps.core.outputs.ref }}
        with:
          script: |
            const marker = '<!-- workbench-preview -->';
            const sha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = [
              marker,
              `**Try this pull request:** ${process.env.URL}`,
              '',
              `The workbench as built from ${sha}, with splitscreenme-vscode@${process.env.CORE}. Updated on every push.`,
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const mine = comments.find((c) => c.body?.includes(marker));
            if (mine) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number, body });
