name: Report details
# Issues opened from the tools (the workbench, VS Code, ncdev, Notepad++; core/report.ts) carry a "Details from the
# tool" block (versions, settings, where the handler is from) with a checksum.
# GitHub can't lock a form field, so this copies the block, as it was when the issue was opened, into a comment the
# reporter can't edit or remove, and says whether the block was changed before sending. Reads the issue only.
on:
  issues:
    types: [opened]
permissions:
  issues: write
jobs:
  keep-details:
    if: contains(github.event.issue.body, '### Details from the tool') || contains(github.event.issue.body, '### Details from the workbench')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/issue-bots.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/github-script@v7
        with:
          script: |
            // The logic is in scripts/issue-bots.mjs (tested by src/test/bots.test.ts).
            const bots = await import(`${process.env.GITHUB_WORKSPACE}/scripts/issue-bots.mjs`);
            await bots.runReportDetails({ github, context });
